name: Winn Protocol (Go)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: winn_protocol_experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: winn_protocol_experimental/go.mod
      - name: Raise UDP socket buffer limits (the gateway refuses to run below 8 MiB)
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216
      - run: go build ./...
      - run: go vet ./...
      # cmd/winn3-gateway's tests expect a provisioned gateway host (proof-status
      # directory ownership and mode, a TUN device, fixed local ports). It is
      # built above; its tests run on gateway nodes, not on hosted runners.
      - run: go test $(go list ./... | grep -v '/cmd/winn3-gateway$')
      - run: go test ./cmd/winn3-gateway -run 'TestDerivePublic'
