# RULINGS.lock — ruled invariants of this tree.
#
# Every entry here encodes a DECISION made by the delegated authority
# (docs/handoff/MACOS_ENFORCEROUTES_TRUE_RULING_20260810.md is the pattern:
# a dated ruling document, then the code). A lane, agent, or refactor that
# needs to change a line guarded here is not blocked from proposing it, but
# the change is a RULING EVENT: it requires a new dated ruling document that
# names the evidence, and the lockfile entry must be updated in the same
# change. Editing this file without such a document is itself a violation.
#
# Verified by tools/verify_rulings.sh. The dispatcher runs it after every
# lane merge and before any release build. It is not a test lanes run for
# themselves; its value is that the DISPATCHER runs it, outside lane
# verification, so a silent revert cannot ride a green lane report.
#
# Format, one entry per line, fields separated by " :: ":
#   REQUIRE :: <path relative to repo root> :: <exact literal that must be present>
#   FORBID  :: <path relative to repo root> :: <exact literal that must be absent>
# Lines starting with # and blank lines are ignored. Literals are matched
# fixed-string (grep -F), not as regexes.

